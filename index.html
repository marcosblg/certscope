<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>CertScope — certificados TLS y dominios</title>
<style>
/* Guía visual Scope: azul noche como AssetScope, acento azul; el color dice el estado (verde OK, ámbar en aviso, rojo vencido). */
:root{
  --bg:#0e131c; --side:#131a26; --panel:#1a2233; --raise:#212b40; --hover:#212b40; --sel:#28344d;
  --line:#2a3650; --line2:#3a4866;
  --tx:#eaf0fb; --tx2:#b3c1da; --tx3:#8797b5;
  --acc:#59a9ff; --accbg:#16375c; --accbd:#3d7ab8;
  --ok:#2fd07a; --warn:#ffb020; --bad:#ff5c6c;
  --okbg:#2fd07a1a; --warnbg:#ffb0201f; --badbg:#ff5c6c1f; --warnbd:#ffb02088; --badbd:#ff5c6c88;
  --sh:0 14px 40px -22px #000;
  --f:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --m:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#eaeef5; --side:#e2e8f1; --panel:#ffffff; --raise:#ffffff; --hover:#f1f4fa; --sel:#dceaff;
  --line:#d3dbe7; --line2:#b9c6d8;
  --tx:#111827; --tx2:#4a5772; --tx3:#6b7a94;
  --acc:#1f6fd0; --accbg:#dceaff; --accbd:#7fb1ec;
  --ok:#12a355; --warn:#b26a00; --bad:#c62b3c;
  --okbg:#12a3551a; --warnbg:#b26a001a; --badbg:#c62b3c1a; --warnbd:#b26a0066; --badbd:#c62b3c66;
  --sh:0 10px 30px -18px #7b88a0;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 var(--f);font-feature-settings:"cv11","ss01","tnum";-webkit-font-smoothing:antialiased;overflow:hidden;
  display:grid;grid-template-rows:40px minmax(0,1fr) 24px;grid-template-columns:224px minmax(0,1fr) 288px;grid-template-areas:"top top top" "tree main insp" "bar bar bar"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:14px;height:14px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--m);font-size:12px}
.mut{color:var(--tx3)}
kbd{font:500 10.5px/1 var(--m);color:var(--tx3);border:1px solid var(--line2);border-radius:4px;padding:2px 4px;background:var(--panel);min-width:16px;text-align:center;display:inline-block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid var(--bg)}
:focus-visible{outline:1.5px solid var(--tx2);outline-offset:1px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.none{background:var(--line2)}
.c-bad{color:var(--bad)!important}.c-warn{color:var(--warn)!important}.c-ok{color:var(--tx2)}
.t-ok{color:var(--ok)!important}

/* barra superior */
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:var(--side);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.1px;width:200px;flex:0 0 auto}
.brand svg{width:16px;height:16px}
#ver{color:var(--tx3);font-weight:400;border-radius:4px;padding:0 3px}
#ver:hover{color:var(--tx);background:var(--hover)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--tx2);min-width:0;white-space:nowrap;overflow:hidden}
.crumb b{color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumb svg{color:var(--tx3);width:12px;height:12px}
.sp{flex:1}
.cmdk{display:flex;align-items:center;gap:8px;width:340px;min-width:0;flex:0 1 340px;height:26px;padding:0 6px 0 9px;border:1px solid var(--line2);border-radius:6px;color:var(--tx3);background:var(--bg)}
.cmdk:hover{border-color:var(--tx3)}
.cmdk span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line2);border-radius:6px;color:var(--tx2);font-weight:500;white-space:nowrap;flex:0 0 auto}
.b:hover{background:var(--hover);color:var(--tx)}
.b:disabled{opacity:.45;cursor:default}
.b.pri{background:var(--accbg);color:var(--acc);border-color:var(--accbd)}
.b.pri:hover{opacity:.88;background:var(--accbg);color:var(--acc)}
.b.pri kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.55}
.b.ic{width:26px;padding:0;justify-content:center}
.b.sm{height:22px;padding:0 7px;font-size:12px}
.b.danger:hover,.b.danger.armed{color:var(--bad);border-color:var(--bad);background:var(--badbg)}
.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;height:26px;flex:0 0 auto}
.seg button{padding:0 8px;color:var(--tx3);font-weight:500;font-size:12px}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--sel);color:var(--tx)}

/* menú de exportar */
.menu{position:fixed;display:none;min-width:290px;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:4px;z-index:65;box-shadow:0 18px 50px -18px #000a}
.menu.on{display:block}
.menu button{display:flex;width:100%;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:5px;color:var(--tx);text-align:left}
.menu button svg{margin-top:2px;color:var(--tx3)}
.menu button:hover{background:var(--hover)}
.menu small{display:block;color:var(--tx3);font-size:11.5px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* árbol */
#tree{grid-area:tree;background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:8px 6px;min-height:0}
#tree .seg{margin:0 4px 10px;height:24px}
#tree .seg button{flex:1}
.th{display:flex;align-items:center;justify-content:space-between;padding:12px 8px 4px;color:var(--tx3);font-size:11px;font-weight:500;letter-spacing:.3px;text-transform:uppercase}
.mini{width:18px;height:18px;border-radius:4px;color:var(--tx3);display:flex;align-items:center;justify-content:center}
.mini:hover{background:var(--hover);color:var(--tx)}
.mini svg{width:12px;height:12px}
.tn{display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:5px;color:var(--tx2);cursor:pointer;white-space:nowrap;user-select:none}
.tn:hover{background:var(--hover)}
.tn.on{background:var(--sel);color:var(--tx)}
.tn .fold{width:14px;height:14px;display:flex;align-items:center;justify-content:center;color:var(--tx3);margin-left:-4px;flex:0 0 auto}
.tn .fold svg{width:10px;height:10px}
.tn .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.tn .n{font:11px var(--m);color:var(--tx3)}
.tn.l2{padding-left:24px}
.dots{display:flex;gap:3px}
.empty-s{padding:4px 8px;color:var(--tx3);font-size:12px}

/* zona central */
#main{grid-area:main;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;min-width:0;min-height:0}
.head{display:flex;align-items:flex-end;gap:16px;padding:14px 18px 0;min-width:0}
.head .grow{min-width:0}
.head h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head p{margin:2px 0 0;color:var(--tx3);font-size:12px}
.stats{display:flex;gap:4px;margin-left:auto;padding-bottom:0;flex:0 0 auto}
.stat{display:flex;align-items:center;gap:6px;color:var(--tx2);padding:3px 8px;border-radius:5px;border:1px solid transparent}
.stat:hover{background:var(--hover)}
.stat.on{border-color:var(--line2);background:var(--sel);color:var(--tx)}
.stat.off{opacity:.5}
.stat b{font:500 13px var(--m);color:var(--tx)}
#fresh:empty{display:none}
#fresh{margin:12px 18px 0;padding:8px 10px 8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#fresh .ft{display:flex;align-items:center;gap:8px;color:var(--tx2)}
#fresh .ft b{color:var(--tx);font-weight:500}
#fresh .items{display:flex;gap:4px;flex-wrap:wrap;flex:1}
#fresh .items button{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;border:1px solid var(--line2);border-radius:5px;color:var(--tx2);font-size:12px}
#fresh .items button:hover{background:var(--hover);color:var(--tx)}
.tabs{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--line);align-items:flex-end;min-width:0}
.tabs>button{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;color:var(--tx3);font-weight:500;border-bottom:1.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs>button:hover{color:var(--tx)}
.tabs>button.on{color:var(--tx);border-color:var(--acc)}
.tabs .n{font:11px var(--m);color:var(--tx3)}
.tabs .tools{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:5px}
.fwrap{display:flex;align-items:center;gap:6px;height:24px;width:220px;padding:0 4px 0 8px;border:1px solid var(--line2);border-radius:6px;color:var(--tx3)}
.fwrap:focus-within{border-color:var(--tx3)}
.fwrap input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:12px;color:var(--tx)}
.fwrap input::placeholder{color:var(--tx3)}
.wrap{overflow:auto;min-height:0}
table.grid{width:100%;border-collapse:collapse;white-space:nowrap}
.grid thead th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:500;font-size:11.5px;color:var(--tx3);padding:7px 10px;border-bottom:1px solid var(--line);z-index:1;user-select:none}
.grid thead th[data-sort]{cursor:pointer}
.grid thead th[data-sort]:hover,.grid thead th.sorted{color:var(--tx)}
.grid thead th .ar{font-family:var(--m);margin-left:4px}
.grid th.r,.grid td.r{text-align:right}
.grid tbody td{padding:0 10px;height:30px;border-bottom:1px solid var(--line);color:var(--tx2)}
.grid tbody tr{cursor:default}
.grid tbody tr:hover td{background:var(--hover)}
.grid tbody tr.on td{background:var(--sel)}
.grid tbody tr.on td:first-child{box-shadow:inset 2px 0 var(--acc)}
.grid td.w18,.grid th.w18{width:18px;padding-right:0}
td.cn{color:var(--tx)!important;font-weight:500;max-width:280px;overflow:hidden;text-overflow:ellipsis}
td.cn .san{color:var(--tx3);font-weight:400;margin-left:6px;font-size:11.5px}
td.tr{max-width:190px;overflow:hidden;text-overflow:ellipsis}
.new{font:600 9.5px var(--m);letter-spacing:.4px;border:1px solid var(--line2);color:var(--tx);border-radius:4px;padding:1px 4px;margin-left:6px;vertical-align:1px}
.days{font:500 12px var(--m)}
.life{display:inline-block;width:36px;height:4px;border-radius:2px;background:var(--line2);vertical-align:middle;margin-right:8px;overflow:hidden}
.life i{display:block;height:100%;background:var(--tx3)}
.life.warn i{background:var(--warn)}.life.bad i{background:var(--bad)}
td.auto svg{width:13px;height:13px;vertical-align:-2px}
.empty{padding:60px 20px;text-align:center;color:var(--tx3)}
.empty h2{margin:0 0 6px;font-size:14px;color:var(--tx);font-weight:600}
.empty p{margin:0 auto 16px;max-width:460px;line-height:1.55}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* calendario */
.cal{padding:6px 18px 24px;max-width:980px}
.cal .bar{display:flex;align-items:center;gap:10px;padding:10px 0 4px;color:var(--tx3);font-size:12px}
.cal h4{margin:18px 0 4px;font-size:11px;font-weight:500;color:var(--tx3);letter-spacing:.3px;text-transform:uppercase}
.crow{display:grid;grid-template-columns:14px 92px minmax(0,1.4fr) 92px minmax(0,1fr) 64px;gap:10px;align-items:center;height:30px;padding:0 8px;border-bottom:1px solid var(--line);color:var(--tx2);cursor:pointer;white-space:nowrap}
.crow:hover{background:var(--hover)}
.crow.on{background:var(--sel)}
.crow span{overflow:hidden;text-overflow:ellipsis}
.crow .nm{color:var(--tx);font-weight:500}
.crow .days{text-align:right}
/* portada: qué caduca */
.sum{padding:16px 18px 28px;max-width:1100px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:6px}
.kpi{background:var(--panel);border:1.5px solid var(--line2);border-radius:12px;padding:13px 15px;text-align:left;display:flex;flex-direction:column;gap:5px;color:var(--tx);box-shadow:var(--sh);min-width:0}
button.kpi:hover{border-color:var(--acc)}
.kpi .lb{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .big{font:700 32px/1 var(--m)}
.kpi small{font-size:11.5px;color:var(--tx3)}
.kpi.bad{border-color:var(--badbd);background:linear-gradient(180deg,var(--badbg),transparent),var(--panel)}.kpi.bad .big{color:var(--bad)}
.kpi.warn{border-color:var(--warnbd);background:linear-gradient(180deg,var(--warnbg),transparent),var(--panel)}.kpi.warn .big{color:var(--warn)}
.kpi.ok .big{color:var(--ok)}
.kpi.auto .big,.kpi.auto .lb svg{color:var(--tx3)}
.kpi.auto.on{border-color:var(--warnbd)}.kpi.auto.on .big,.kpi.auto.on .lb svg{color:var(--warn)}
.kpi.off{opacity:.45}
.uh{margin:20px 0 8px;font-size:11.5px;font-weight:600;color:var(--tx2);letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.urow{display:grid;grid-template-columns:10px 84px minmax(0,.9fr) minmax(0,1.5fr) auto auto;gap:14px;align-items:center;min-height:54px;padding:8px 12px 8px 14px;margin-bottom:6px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:10px;cursor:pointer}
.urow:hover{border-color:var(--line2)}
.urow.on{background:var(--sel)}
.urow.bad{border-left-color:var(--bad)}.urow.warn{border-left-color:var(--warn)}.urow.ok{border-left-color:var(--ok)}
.urow .dot{width:9px;height:9px}
.urow.bad .dot{box-shadow:0 0 8px var(--bad)}
.urow b{display:block;color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urow .un b{font-size:14px}
.urow small{display:block;color:var(--tx3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ud{color:var(--tx2)}
.us{font:600 13px var(--m);white-space:nowrap;text-align:right}
.af{color:var(--warn);margin-left:6px}
.af svg{width:12px;height:12px;vertical-align:-2px;margin-right:3px}
.allok{display:flex;align-items:center;gap:10px;margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--tx2)}
.allok svg{color:var(--ok);width:18px;height:18px}

/* registro de cambios */
#log{border-top:1px solid var(--line);background:var(--side);height:160px;display:grid;grid-template-rows:30px minmax(0,1fr)}
#log.off{height:31px}
#log.off .wrap{display:none}
#log .lh{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--tx3);font-size:12px}
#log .lh b{color:var(--tx);font-weight:500}
#log .lh button{display:flex;align-items:center;gap:6px;color:var(--tx3)}
#log .lh button:hover{color:var(--tx)}
table.lg{width:100%;border-collapse:collapse;white-space:nowrap}
.lg td{height:24px;padding:0 10px;font-size:12px;border-bottom:1px solid var(--line);color:var(--tx3);overflow:hidden;text-overflow:ellipsis;max-width:420px}
.lg td.lt{font:11.5px var(--m);width:130px}
.lg td.act{color:var(--tx);width:190px}
.lg td.act .dot{margin-right:6px;vertical-align:1px}
.lg td.obj{color:var(--tx2);width:260px}
.vlog .lg td{height:28px}

/* inspector */
#insp{grid-area:insp;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0}
.ih{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 7px 2px 6px;border-radius:5px;background:var(--hover);color:var(--tx2)}
.st.warn{background:var(--warnbg);color:var(--warn)}.st.bad{background:var(--badbg);color:var(--bad)}.st.ok{background:var(--okbg);color:var(--ok)}
.ih h2{margin:8px 0 2px;font-size:14px;font-weight:600;letter-spacing:-.2px;word-break:break-all}
.ih p{margin:0;color:var(--tx3);font-size:12px}
.tl{margin:12px 0 2px;height:4px;border-radius:2px;background:var(--line2);position:relative}
.tl i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--tx3)}
.tl.warn i{background:var(--warn)}.tl.bad i{background:var(--bad)}
.tl u{position:absolute;top:-3px;width:1px;height:10px;background:var(--tx2)}
.tll{display:flex;justify-content:space-between;color:var(--tx3);font:11px var(--m);margin-top:6px}
.sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 8px;font-size:11px;font-weight:500;color:var(--tx3);letter-spacing:.3px;text-transform:uppercase}
dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:7px 10px;margin:0}
dt{color:var(--tx3)}
dd{margin:0;color:var(--tx);min-width:0;overflow-wrap:anywhere}
dd.mono{font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font:11.5px var(--m);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--tx2);overflow-wrap:anywhere}
.acts{display:flex;flex-direction:column;gap:2px;padding:10px 8px}
.acts button{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:5px;color:var(--tx2);text-align:left}
.acts button:hover{background:var(--hover);color:var(--tx)}
.acts button span{flex:1}
.note{color:var(--tx2);line-height:1.5;white-space:pre-wrap}
.alert{margin-top:10px;padding:7px 9px;border-radius:6px;background:var(--warnbg);color:var(--warn);font-size:12px;line-height:1.45}
.iempty{padding:40px 22px;color:var(--tx3);text-align:center;line-height:1.55}
.iempty svg{width:22px;height:22px;margin-bottom:8px}

/* barra de estado */
#bar{grid-area:bar;display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:var(--side);color:var(--tx3);font-size:11.5px;white-space:nowrap;overflow:hidden}
#bar .k{display:flex;align-items:center;gap:5px}
#savest{display:flex;align-items:center;gap:6px;color:var(--tx3)}
#savest:hover{color:var(--tx)}
#savest.bad{color:var(--bad);font-weight:600}

/* paleta Ctrl+K */
#pal{position:fixed;inset:0;background:#0000007a;display:none;align-items:flex-start;justify-content:center;padding:110px 16px 0;z-index:80}
html[data-theme="light"] #pal{background:#18181b33}
#pal.on{display:flex}
.pbox{width:620px;max-width:100%;background:var(--raise);border:1px solid var(--line2);border-radius:10px;box-shadow:0 24px 70px -20px #000c;overflow:hidden}
.pin{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;border-bottom:1px solid var(--line)}
.pin input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:14.5px}
.pin input::placeholder{color:var(--tx3)}
.pin svg{color:var(--tx3);width:16px;height:16px}
.plist{max-height:380px;overflow:auto;padding:6px}
.pg{padding:8px 10px 4px;color:var(--tx3);font-size:11px;font-weight:500}
.pi{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;color:var(--tx2);cursor:pointer}
.pi.on{background:var(--sel);color:var(--tx)}
.pi .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .t small{color:var(--tx3);margin-left:8px;font-size:12px}
.pi .k{display:flex;gap:3px}
.pnone{padding:18px 12px;color:var(--tx3)}
.pf{display:flex;align-items:center;gap:14px;padding:0 12px;height:34px;border-top:1px solid var(--line);color:var(--tx3);font-size:11.5px}
.pf span{display:flex;align-items:center;gap:5px}

/* ventanas */
#veil{position:fixed;inset:0;background:#0000007a;display:none;align-items:flex-start;justify-content:center;padding:7vh 16px 24px;z-index:70;overflow:auto}
html[data-theme="light"] #veil{background:#18181b33}
#veil.on{display:flex}
.modal{width:560px;max-width:100%;background:var(--raise);border:1px solid var(--line2);border-radius:10px;box-shadow:0 24px 70px -20px #000c}
.modal.wide{width:780px}
.modal h3{margin:0;padding:13px 18px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-width:0;word-break:break-all}
.modal h3 .tag{font:500 11px var(--f);color:var(--tx3);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;word-break:normal}
.modal .body{padding:16px 18px;display:grid;gap:12px}
.modal .foot{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fld label{display:block;font-size:11.5px;color:var(--tx3);margin-bottom:4px}
.in{width:100%;height:30px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:0 9px;outline:none}
textarea.in{height:auto;padding:7px 9px;resize:vertical;font-family:var(--m);font-size:12px;line-height:1.5}
textarea.in.tx{font-family:var(--f);font-size:13px}
.in:focus{border-color:var(--tx3)}
.in.bad{border-color:var(--bad)}
input.num{width:70px;display:inline-block;height:26px}
.hint{color:var(--tx3);font-size:12px;line-height:1.55}
.hint b{color:var(--tx2);font-weight:500}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx2);cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--tx);margin:0}
.ind{padding-left:22px}
.pres{display:grid;gap:4px}
.pres:empty{display:none}
.prow{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;color:var(--tx2);font-size:12px;min-width:0}
.prow b{color:var(--tx);font-weight:500}
.prow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .mono{margin-left:auto;flex:0 0 auto}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;align-items:center}
.keys span:nth-child(odd){display:flex;gap:3px;justify-content:flex-end}
.nv h4{margin:0 0 4px;font-size:13px;display:flex;gap:10px;align-items:baseline}
.nv h4 span{color:var(--tx3);font-weight:400;font-size:12px}
.nv ul{margin:0;padding-left:18px;color:var(--tx2);line-height:1.55}
#toast{position:fixed;bottom:36px;left:50%;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;z-index:90;transition:.15s;box-shadow:0 12px 40px -16px #000a;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast .act{margin-left:10px;text-decoration:underline;color:var(--tx)}

/* pantallas estrechas: primero se va el inspector, luego el árbol */
@media (max-width:1180px){body{grid-template-columns:210px minmax(0,1fr) 0}#insp{display:none}.brand{width:auto}}
@media (max-width:820px){
  body{grid-template-columns:0 minmax(0,1fr) 0}#tree{display:none}
  .crumb,#pemBtn span,#expBtn span,#addBtn span,#addBtn kbd,#pemBtn kbd,#bar .k,#avinfo,.stats{display:none}
  .cmdk{flex:1 1 auto}.fwrap{width:150px}.g2,.g3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.urow{grid-template-columns:10px minmax(0,1fr) auto auto}.urow .ud,.urow .uw{display:none}
}

/* PDF */
#print{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;color:#000;display:block}
  body>*:not(#print){display:none!important}
  #print{display:block;font:9.5pt/1.4 "Segoe UI",system-ui,sans-serif;color:#000}
  #print h1{font-size:16pt;margin:0 0 1mm}
  #print h2{font-size:11pt;margin:7mm 0 2mm}
  #print .meta{color:#555;font-size:8.5pt}
  #print table{width:100%;border-collapse:collapse;font-size:8.3pt}
  #print th,#print td{border-bottom:.3mm solid #ddd;padding:1.2mm 1.5mm;text-align:left;vertical-align:top}
  #print th{color:#555;font-weight:600}
  #print .num{text-align:right;white-space:nowrap}
  #print .nw{white-space:nowrap}
  #print .s-bad{color:#c62828;font-weight:600}
  #print .s-warn{color:#9a5b00;font-weight:600}
  #print .kp{display:flex;gap:4mm;margin:4mm 0}
  #print .kp div{border:.3mm solid #ccc;border-radius:2mm;padding:2mm 4mm;font-size:8.5pt;color:#555}
  #print .kp b{display:block;font-size:14pt;color:#000}
  @page{size:A4 landscape;margin:12mm}
}

<script id="i18n">
"use strict";
/* ---------- idioma: espanol / ingles ----------
   La aplicacion se escribe en espanol. Si el navegador esta en otro idioma (o se elige EN),
   cada texto fijo de la pagina se cambia por su traduccion al pintarse: textos, avisos (title),
   marcadores de los campos y el titulo de la pagina. Lo que se pinta desde el codigo ya sale
   en el idioma elegido con L(es,en). Los datos que escribe el usuario no se tocan. */
const I18N=(()=>{
  const LK="certscope.lang";
  let lang="es";
  try{const s=localStorage.getItem(LK);lang=s==="en"||s==="es"?s:((navigator.language||"es").toLowerCase().startsWith("es")?"es":"en");}
  catch(e){lang=(navigator.language||"es").toLowerCase().startsWith("es")?"es":"en";}
  const D=new Map(Object.entries({
"CertScope — certificados TLS y dominios": "CertScope — TLS certificates and domains",
"Ver novedades": "What's new",
"Paleta de comandos (Ctrl+K)": "Command palette (Ctrl+K)",
"Buscar o ejecutar una acción…": "Search or run an action…",
"Importar un certificado pegando su PEM": "Import a certificate by pasting its PEM",
"Pegar PEM": "Paste PEM",
"Exportar": "Export",
"Añadir certificado": "Add certificate",
"Añadir": "Add",
"Ajustes": "Settings",
"Cambiar tema": "Change theme",
"Informe (PDF)": "Report (PDF)",
"Estado, vencimientos e inventario completo": "Status, expiry dates and full inventory",
"Una fila por certificado o dominio": "One row per certificate or domain",
"Calendario de vencimientos (.ics)": "Expiry calendar (.ics)",
"Avisos en Outlook o Google Calendar": "Reminders in Outlook or Google Calendar",
"Copia de seguridad (JSON)": "Backup (JSON)",
"Para volver a importarla aquí": "To import it here again",
"Importar copia (JSON)": "Import backup (JSON)",
"Sustituye los datos por los de la copia": "Replaces the data with the backup's",
"Guardar en un archivo…": "Save to a file…",
"Se reescribe solo cada vez que cambias algo": "Rewritten automatically every time you change something",
"Entorno": "Environment",
"Cliente": "Client",
"Dominio": "Domain",
"Dominios registrados": "Registered domains",
"Añadir dominio (D)": "Add domain (D)",
"Certificados": "Certificates",
"Qué caduca": "What expires",
"Dominios": "Domains",
"Calendario": "Calendar",
"Registro": "Log",
"Filtrar…": "Filter…",
"Registro de cambios": "Change log",
"Ocultar": "Hide",
"Dónde se guardan los datos": "Where the data is saved",
"moverse": "move",
"editar": "edit",
"filtrar": "filter",
"paleta": "palette",
"atajos": "shortcuts",
"Buscar certificados, dominios, servidores o acciones…": "Search certificates, domains, servers or actions…",
"elegir": "choose",
"abrir": "open",
// datos de ejemplo
"Producción": "Production",
"Preproducción": "Staging",
"Laboratorio": "Lab",
"Interno": "Internal",
"Sistemas": "IT team",
"Notas": "Notes",
"Ayto. Villanueva": "Villanueva Town Hall",
"Clínica Soler": "Soler Clinic",
"La última renovación automática falló: revisar la tarea programada de win-acme en srv-rdgw.": "The last automatic renewal failed: check the win-acme scheduled task on srv-rdgw.",
"Tras instalarlo: Enable-ExchangeCertificate -Services IIS,SMTP y reiniciar IIS.": "After installing it: Enable-ExchangeCertificate -Services IIS,SMTP and restart IIS.",
"Se instala a mano en el FortiGate y en el perfil de FortiClient.": "Installed by hand on the FortiGate and in the FortiClient profile.",
"Certificado autofirmado del controlador; se renueva desde la consola de UniFi.": "Self-signed controller certificate; renewed from the UniFi console.",
"Lo emite la CA interna (AD CS) por autoinscripción.": "Issued by the internal CA (AD CS) through autoenrollment.",
"Exportado desde la sede electrónica; pedir el nuevo con 30 días de margen.": "Exported from the e-government site; request the new one 30 days ahead.",
"Renovación manual: la tarjeta asociada caduca este mes.": "Manual renewal: the card on file expires this month."
}));
  const P=[];   // patrones (texto con numeros): de momento todo lo variable sale ya traducido con L()
  const SKIP=new Set(["SCRIPT","STYLE","TEXTAREA","INPUT","CODE"]);
  function core(s){
    let r=D.get(s);if(r!=null)return r;
    for(const [re,f] of P){const m=re.exec(s);if(m){const x=typeof f==="function"?f(...m):s.replace(re,f);if(x!==s)return x;}}
    // frases hechas de piezas: "Producción · Clínica Soler"
    for(const sep of [" · "," › "," / "]){
      if(!s.includes(sep))continue;
      let any=false;const parts=s.split(sep).map(p=>{const t=p.trim()?core(p.trim()):null;if(t!=null){any=true;return t;}return p;});
      if(any)return parts.join(sep);
    }
    return null;
  }
  function tr(s){
    if(lang==="es"||s==null)return s;
    s=String(s);const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s);
    if(!m[2]||!/[A-Za-zÁÉÍÓÚáéíóúÑñ¿¡]/.test(m[2]))return s;
    if(m[2].includes("\n"))return m[1]+m[2].split("\n").map(tr).join("\n")+m[3];   // avisos de varias lineas
    const r=core(m[2]);return r==null?s:m[1]+r+m[3];
  }
  const ATTR=["title","placeholder","aria-label"];
  function doEl(el){
    if(el.closest&&el.closest("[data-notr]"))return;
    ATTR.forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v){const t=tr(v);if(t!==v)el.setAttribute(a,t);}});
  }
  function doText(n){
    const p=n.parentNode;if(!p||SKIP.has(p.nodeName)||(p.closest&&p.closest("[data-notr]")))return;
    const v=n.nodeValue,t=tr(v);if(t!==v)n.nodeValue=t;
  }
  function walk(root){
    if(lang==="es"||!root)return;
    if(root.nodeType===3){doText(root);return;}
    if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11)return;
    if(root.nodeType===1){if(root.nodeName==="SCRIPT"||root.nodeName==="STYLE")return;doEl(root);}
    const w=document.createTreeWalker(root,5,null);let n;   // 5 = elementos y textos
    while((n=w.nextNode())){if(n.nodeType===3)doText(n);else doEl(n);}
  }
  let mo=null;
  function start(){
    if(lang==="es"||mo)return;
    document.documentElement.lang="en";
    walk(document.body);document.title=tr(document.title);
    mo=new MutationObserver(list=>{for(const r of list){
      if(r.type==="childList")r.addedNodes.forEach(walk);
      else if(r.type==="characterData")doText(r.target);
      else if(r.type==="attributes")doEl(r.target);}});
    mo.observe(document.documentElement,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:ATTR});
  }
  // ventanas del navegador
  const _c=window.confirm.bind(window),_a=window.alert.bind(window);
  window.confirm=m=>_c(trLines(m));window.alert=m=>_a(trLines(m));
  function trLines(m){return String(m==null?"":m).split("\n").map(tr).join("\n");}
  // datos de ejemplo: en ingles para quien entra en ingles (solo los textos que estan en el diccionario)
  function data(o){
    if(lang==="es")return o;
    if(typeof o==="string")return tr(o);
    if(Array.isArray(o))return o.map(data);
    if(o&&typeof o==="object"){Object.keys(o).forEach(k=>{if(!/^(id|cn|san|desde|hasta|serie|huella|clave|t|k|o|auto|emisor|servidor|servicio|nombre|registrador)$/.test(k))o[k]=data(o[k]);});}
    return o;
  }
  function setLang(l){try{localStorage.setItem(LK,l);}catch(e){}location.reload();}
  return {get lang(){return lang;},tr,start,data,setLang};
})();
const T=I18N.tr;
I18N.start();
</script>

<script id="app">
"use strict";

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- fechas (dias naturales, sin horas) ---------- */
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());

const addD=(iso,n)=>new Date((dnum(iso)+n)*864e5).toISOString().slice(0,10);
const rd=n=>addD(todayIso(),n);
const days=iso=>dd(todayIso(),iso);
const fdate=iso=>!iso?"":L(iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4),iso.slice(0,10));
const fdt=t=>fdate(t.slice(0,10))+t.slice(10);

const rel=d=>d===0?L("hoy","today"):d>0?L("en ","in ")+nd(d):L("hace "+nd(-d),nd(-d)+" ago");

const LVL={bad:["Vencido","Expired"],warn:["En aviso","Due soon"],ok:["Al día","OK"],none:["Sin fecha","No date"]};

  renew:["Renovado","Renewed"],imp:["Copia importada","Backup imported"],exp:["Venció","Expired"],warn:["Entró en aviso","Became due soon"]};

/* ---------- periodo de aviso ----------

   100 desde el 15/03/2027 y 47 desde el 15/03/2029. Los dominios avisan siempre 30 dias antes. */
const CAB=[["2029-03-15",47],["2027-03-15",100],["2026-03-15",200]];
function vida(c){
  if(c.desde&&c.hasta&&c.desde<c.hasta)return dd(c.desde,c.hasta);
  if(!c.hasta)return 0;
  for(const [cut,n] of CAB)if(addD(c.hasta,-n)>=cut)return n;
  return 398;
}
function avisoDe(o,k,fijo){
  if(fijo===undefined)fijo=DB.cfg.aviso;

  const av=avisoDe(o,k);

function stTxt(s){
  if(s.lvl==="none")return lvlN("none");
  if(s.d<0)return L("Vencido hace "+nd(-s.d),"Expired "+nd(-s.d)+" ago");
  if(s.d===0)return L("Vence hoy","Expires today");

function events(){
  const out=[];

  DB.doms.forEach(o=>{if(o.hasta){const s=st(o,"dom");out.push({o,k:"dom",iso:o.hasta,d:s.d,av:s.av,lvl:s.lvl});}});
  return out.sort((a,b)=>a.d-b.d||nm(a.o).localeCompare(nm(b.o)));

// dominio raiz: www.acme.es -> acme.es; sede.ayto.gob.es -> ayto.gob.es
const SLD=new Set(["co","com","gob","org","net","edu","ac","nom","gov"]);
function raiz(h){
  h=String(h||"").toLowerCase().replace(/^\*\./,"");
  if(/^[\d.]+$/.test(h)||h.includes(":"))return h;
  const p=h.split(".").filter(Boolean);if(p.length<=2)return p.join(".");
  const n=p[p.length-1].length===2&&SLD.has(p[p.length-2])?3:2;
  return p.slice(-n).join(".");
}

/* ---------- datos ---------- */
const t80=(x,n)=>str(x).slice(0,n||200);
const safeId=(x,p)=>typeof x==="string"&&/^[\w-]{1,64}$/.test(x)?x:nid(p);

  if(!c||typeof c!=="object")return null;

    auto:c.auto===true,clave:t80(c.clave,40),serie:t80(c.serie,200),huella:t80(c.huella,120),notas:str(c.notas).slice(0,4000)};
}
function cleanDom(d){
  if(!d||typeof d!=="object")return null;

  return {id:safeId(d.id,"d"),nombre,registrador:t80(d.registrador,120),hasta:isoOk(d.hasta),cliente:t80(d.cliente,120),
    responsable:t80(d.responsable,120),auto:d.auto===true,notas:str(d.notas).slice(0,4000)};
}
function cleanLog(x){
  if(!x||typeof x.t!=="string"||!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(x.t)||!LOGK[x.k])return null;
  return {t:x.t,k:x.k,o:t80(x.o,253),n:t80(x.n,300)};
}
function parseDB(x){
  if(!x||typeof x!=="object"||!Array.isArray(x.certs))return null;
  const seen=new Set(),uniq=o=>{if(seen.has(o.id))o.id=nid("x");seen.add(o.id);return o;};
  const cfg=x.cfg&&typeof x.cfg==="object"?x.cfg:{};
  return {v:1,app:"certscope",theme:x.theme==="light"?"light":"dark",tab:["sum","cert","dom","cal","log"].includes(x.tab)?x.tab:"sum",
    grp:["env","cli","dom"].includes(x.grp)?x.grp:"env",logOn:x.logOn!==false,
    cfg:{aviso:Number.isInteger(cfg.aviso)&&cfg.aviso>0&&cfg.aviso<=365?cfg.aviso:0,empresa:t80(cfg.empresa,120)},
    certs:x.certs.map(cleanCert).filter(Boolean).map(uniq),

const hexSerial=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0").toUpperCase()).join(":");

    c("vpn.acme-logistica.es",0,"AlphaSSL CA - SHA256 - G4",-3,199,"fw-edge01","FortiGate SSL-VPN",P,AC,"Pablo Ruiz",false,0,"Se instala a mano en el FortiGate y en el perfil de FortiClient."),
    c("nas01.transportesruiz.es",0,"Sectigo RSA Domain Validation Secure Server CA",-10,199,"nas01","Synology DSM",P,TR,"Marta Blanco",false),
    c("rdweb.transportesruiz.es",0,"R10",11,90,"srv-rdgw","RD Gateway (win-acme)",P,TR,"Marta Blanco",true,0,"La última renovación automática falló: revisar la tarea programada de win-acme en srv-rdgw."),
    c("mail.acme-logistica.es",["mail.acme-logistica.es","autodiscover.acme-logistica.es"],"Sectigo RSA Domain Validation Secure Server CA",17,199,"srv-exch01","Exchange 2019",P,AC,"Pablo Ruiz",false,0,"Tras instalarlo: Enable-ExchangeCertificate -Services IIS,SMTP y reiniciar IIS."),
    c("citas.clinicasoler.com",0,"E6",39,90,"lb-01","HAProxy",P,CS,"Jordi Soler",true,"EC P-384"),

    c("api.clinicasoler.com",0,"E5",82,90,"lb-01","HAProxy",P,CS,"Jordi Soler",true,"EC P-256"),

    c("staging.acme-logistica.es",0,"R11",40,90,"srv-stg01","nginx",PRE,AC,"Ana Ortega",true),

  const d=(nombre,registrador,dl,cliente,responsable,auto,notas)=>({id:nid("d"),nombre,registrador,hasta:rd(dl),cliente,responsable,auto,notas:notas||""});
  const doms=[d("transportesruiz.es","IONOS",6,TR,"Marta Blanco",false,"Renovación manual: la tarjeta asociada caduca este mes."),
    d("clinicasoler.com","OVHcloud",24,CS,"Jordi Soler",true),d("villanueva.es","Arsys",90,"Ayto. Villanueva","Sistemas",false),
    d("acme-logistica.es","DonDominio",193,AC,"Pablo Ruiz",true)];
  const log=[{t:rd(-1)+" 09:12",k:"pem",o:"test-citas.clinicasoler.com",n:""},{t:rd(-2)+" 17:40",k:"edit",o:"rdweb.transportesruiz.es",n:"Notas"},
    {t:rd(-6)+" 11:05",k:"add",o:"unifi.lab.local",n:""},{t:rd(-8)+" 10:14",k:"renew",o:"api.clinicasoler.com",n:""}];

function freshDB(withSeed){
  const d={v:1,app:"certscope",theme:matchMedia("(prefers-color-scheme: light)").matches?"light":"dark",tab:"sum",grp:"env",logOn:true,
    cfg:{aviso:0,empresa:""},certs:[],doms:[],log:[]};
  if(withSeed)Object.assign(d,seed());
  return d;
}
function load(){try{const d=parseDB(JSON.parse(localStorage.getItem(KEY)||"null"));if(d)return d;}catch(e){}return freshDB(true);}

let DB=null,UNDO=[],REDO=[],hData="",hMute=false,BOOTED=false,lsOK=true,fileHandle=null,fileName="",wT=0,FRESH=null;
const dataKey=()=>JSON.stringify({c:DB.certs,d:DB.doms,l:DB.log,g:DB.cfg});
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB));lsOK=true;}catch(e){lsOK=false;}
  const k=dataKey();
  if(k!==hData){
    if(!hMute){UNDO.push(hData);if(UNDO.length>60)UNDO.shift();REDO=[];}
    hData=k;
    if(fileHandle){clearTimeout(wT);wT=setTimeout(writeFile,600);}
    if(BOOTED&&!FRESH)markSeen();
  }
  updateSaveUI();
}
function histGo(from,to,msg){
  if(!from.length){toast(msg[0]);return;}
  to.push(hData);const x=JSON.parse(from.pop());
  DB.certs=x.c;DB.doms=x.d;DB.log=x.l;DB.cfg=x.g;
  hMute=true;save();hMute=false;render();toast(msg[1]);
}
const undo=()=>histGo(UNDO,REDO,[L("No hay nada que deshacer","Nothing to undo"),L("Deshecho","Undone")]);
const redo=()=>histGo(REDO,UNDO,[L("No hay nada que rehacer","Nothing to redo"),L("Rehecho","Redone")]);
function logAdd(k,o,n){DB.log.unshift({t:nowStamp(),k,o:String(o||"").slice(0,253),n:String(n||"").slice(0,300)});if(DB.log.length>500)DB.log.length=500;}
// registro + lo que ha pasado solo en los ultimos 90 dias (vencimientos y entradas en aviso)
function logAll(){
  const out=DB.log.slice(),t=todayIso(),from=rd(-90);
  events().forEach(e=>{
    if(e.iso<=t&&e.iso>=from)out.push({t:e.iso,k:"exp",o:nm(e.o),n:L(KIND[e.k][0],KIND[e.k][1]),c:true});
    const w=addD(e.iso,-e.av);
    if(w<=t&&w>=from)out.push({t:w,k:"warn",o:nm(e.o),n:L(`aviso ${e.av} días antes`,`${e.av}-day warning`),c:true});
  });
  return out.sort((a,b)=>a.t<b.t?1:a.t>b.t?-1:0);
}

/* ---------- archivo vinculado ---------- */
function idb(){return new Promise(res=>{try{const q=indexedDB.open("certscope",1);
  q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function idbPut(k,v){const d=await idb();if(!d)return;try{d.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){}}
async function idbGet(k){const d=await idb();if(!d)return null;return new Promise(res=>{try{
  const q=d.transaction("kv","readonly").objectStore("kv").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function writeFile(){
  if(!fileHandle)return false;
  try{const w=await fileHandle.createWritable();await w.write(JSON.stringify(DB,null,2));await w.close();updateSaveUI();return true;}
  catch(e){toast(L("No se pudo escribir en el archivo vinculado","Couldn't write to the linked file"));return false;}
}
const FTYPES=[{description:"Inventario de CertScope",accept:{"application/json":[".json"]}}];
async function linkFile(){
  if(!window.showSaveFilePicker){toast(L("Tu navegador no permite vincular archivo: usa Exportar › Copia de seguridad","Your browser can't link a file: use Export › Backup"));return;}
  try{
    fileHandle=await showSaveFilePicker({suggestedName:"certscope-inventario.json",types:FTYPES});
    fileName=fileHandle.name;await idbPut("handle",fileHandle);await idbPut("name",fileName);
    await writeFile();toast(L("Guardado automático en ","Auto-saving to ")+fileName);
  }catch(e){}
  updateSaveUI();
}
async function openFile(){
  if(!window.showOpenFilePicker){pickFile(".json");return;}
  try{
    const [h]=await showOpenFilePicker({types:FTYPES});
    const d=parseDB(JSON.parse(await (await h.getFile()).text()));if(!d)throw 0;
    DB=d;fileHandle=h;fileName=h.name;await idbPut("handle",h);await idbPut("name",fileName);
    setTheme(DB.theme);UNDO=[];REDO=[];hData=dataKey();save();checkFresh();render();toast(L("Cargado desde ","Loaded from ")+fileName);
  }catch(e){if(e&&e.name==="AbortError")return;toast(L("No se pudo abrir el archivo","Couldn't open the file"));}
}
async function restoreHandle(){
  try{
    const h=await idbGet("handle");if(!h)return;
    if(await h.queryPermission({mode:"readwrite"})==="granted"){
      fileHandle=h;fileName=h.name;
      try{const d=parseDB(JSON.parse(await (await h.getFile()).text()));if(d){DB=d;setTheme(DB.theme);UNDO=[];REDO=[];hData=dataKey();checkFresh();render();}}catch(e){}
    }else toast(L("Pulsa abajo a la izquierda para reconectar ","Click bottom left to reconnect ")+(await idbGet("name")||""));
  }catch(e){}
  updateSaveUI();
}
function updateSaveUI(){

  else if(lsOK){n.innerHTML=`<span class="dot ok"></span>${L("Guardado en el navegador","Saved in the browser")}`;n.className="";n.title=L("Pulsa para guardar también en un archivo","Click to also save to a file");}
  else{n.innerHTML=`<span class="dot bad"></span>${L("SIN GUARDAR: pulsa para guardar en un archivo","NOT SAVED: click to save to a file")}`;n.className="bad";n.title="";}
}

/* ---------- avisos ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600);}
function toastUndo(m){
  const t=$("#toast");t.innerHTML=esc(m)+` <button class="act">${L("Deshacer","Undo")}</button>`;
  t.classList.add("on");clearTimeout(t._t);
  $(".act",t).onclick=()=>{t.classList.remove("on");undo();};
  t._t=setTimeout(()=>t.classList.remove("on"),30000);
}

/* ---------- lo nuevo desde la ultima visita ---------- */
const SEEN=KEY+".seen";
const evKey=e=>e.o.id+"|"+e.k+"|"+e.iso+"|"+e.lvl;
function markSeen(){try{localStorage.setItem(SEEN,JSON.stringify({d:todayIso(),k:events().filter(e=>e.lvl!=="ok").map(evKey)}));}catch(e){}}
function checkFresh(){
  let prev=null;try{prev=JSON.parse(localStorage.getItem(SEEN)||"null");}catch(e){}
  if(!prev||!Array.isArray(prev.k)){FRESH=null;markSeen();return;}
  const old=new Set(prev.k),nuevos=events().filter(e=>e.lvl!=="ok"&&e.lvl!=="none"&&!old.has(evKey(e)));
  if(!nuevos.length){FRESH=null;markSeen();return;}
  FRESH={desde:isoOk(prev.d),list:nuevos};
}
function renderFresh(){
  const box=$("#fresh");
  if(FRESH){const cur=new Set(events().map(evKey));FRESH.list=FRESH.list.filter(e=>cur.has(evKey(e)));if(!FRESH.list.length){FRESH=null;markSeen();}}
  if(!FRESH){box.innerHTML="";return;}
  FRESH.ids=new Set(FRESH.list.map(e=>e.o.id));
  const w=FRESH.list.filter(e=>e.lvl==="warn").length,b=FRESH.list.length-w,parts=[];
  if(w)parts.push(L(w===1?"1 ha entrado en aviso":w+" han entrado en aviso",w===1?"1 is now due soon":w+" are now due soon"));

    const prev=DB.certs.find(c=>c.cn.toLowerCase()===p.cn.toLowerCase()&&(!c.hasta||c.hasta<p.hasta));
    if(prev){const o=prev.hasta;Object.assign(prev,{san:p.san,emisor:p.emisor,desde:p.desde,hasta:p.hasta,serie:p.serie,clave:p.clave,huella:p.huella});

/* ---------- certificados X.509 (DER / PEM) ----------
   Lector ASN.1 minimo: solo lo que hace falta para el inventario. Todo ocurre en el navegador. */
const X509=(()=>{
  const hexs=(u,s,e)=>[...u.subarray(s,e)].map(x=>x.toString(16).padStart(2,"0").toUpperCase()).join(":");
  function b64(s){const bin=atob(s.replace(/[^A-Za-z0-9+/=]/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
  function blocks(txt){
    const out=[],re=/-----BEGIN (?:X509 |TRUSTED )?CERTIFICATE-----([\s\S]*?)-----END (?:X509 |TRUSTED )?CERTIFICATE-----/g;let m;
    while((m=re.exec(String(txt||"")))){try{out.push(b64(m[1]));}catch(e){out.push(new Uint8Array(0));}}
    return out;
  }
  function node(b,p){
    if(p+2>b.length)throw new Error("asn1");
    const tag=b[p];let len=b[p+1],h=2;
    if(len&0x80){const n=len&0x7f;if(n<1||n>4||p+2+n>b.length)throw new Error("asn1");len=0;for(let i=0;i<n;i++)len=len*256+b[p+2+i];h+=n;}
    const s=p+h,e=s+len;if(e>b.length)throw new Error("asn1");
    return {tag,s,e};
  }
  function kids(b,n){const out=[];let p=n.s;while(p<n.e){const k=node(b,p);if(k.e>n.e)throw new Error("asn1");out.push(k);p=k.e;}return out;}
  function oid(b,n){const v=[];let x=0;for(let i=n.s;i<n.e;i++){x=x*128+(b[i]&0x7f);if(!(b[i]&0x80)){v.push(x);x=0;}}
    const f=v.shift(),a=f<40?0:f<80?1:2;return [a,f-a*40,...v].join(".");}
  function text(b,n){const u=b.subarray(n.s,n.e);
    if(n.tag===0x1e){let s="";for(let i=0;i+1<u.length;i+=2)s+=String.fromCharCode(u[i]<<8|u[i+1]);return s;}
    return new TextDecoder(n.tag===0x0c?"utf-8":"latin1").decode(u);}
  function time(b,n){
    const s=new TextDecoder("latin1").decode(b.subarray(n.s,n.e));let y,r;
    if(n.tag===0x17){y=+s.slice(0,2);y+=y<50?2000:1900;r=s.slice(2);}else if(n.tag===0x18){y=+s.slice(0,4);r=s.slice(4);}else throw new Error("time");
    const iso=y+"-"+r.slice(0,2)+"-"+r.slice(2,4);if(!isoOk(iso))throw new Error("time");return iso;
  }
  function name(b,n){const o={};kids(b,n).forEach(set=>kids(b,set).forEach(atv=>{const [t,v]=kids(b,atv);const id=oid(b,t);if(!(id in o))o[id]=text(b,v);}));return o;}
  const CURVE={"1.2.840.10045.3.1.7":"P-256","1.3.132.0.34":"P-384","1.3.132.0.35":"P-521"};
  function key(b,spki){
    const [alg,bits]=kids(b,spki),[ao,par]=kids(b,alg),id=oid(b,ao);
    if(id==="1.2.840.113549.1.1.1"){const [mod]=kids(b,node(b,bits.s+1));let s=mod.s;while(s<mod.e-1&&b[s]===0)s++;
      return "RSA "+((mod.e-s)*8-(Math.clz32(b[s])-24));}
    if(id==="1.2.840.10045.2.1"){const c=par&&par.tag===6?oid(b,par):"";return "EC "+(CURVE[c]||c);}
    return {"1.3.101.112":"Ed25519","1.3.101.113":"Ed448"}[id]||id;
  }
  const ip6=u=>[0,1,2,3,4,5,6,7].map(i=>((u[2*i]<<8)|u[2*i+1]).toString(16)).join(":");
  function parse(b){
    const root=node(b,0);if(root.tag!==0x30)throw new Error("x509");
    const [tbs]=kids(b,root),f=kids(b,tbs);let i=0;
    if(f[0].tag===0xa0)i++;               // version
    const serial=f[i++];i++;              // + algoritmo de firma
    const issuer=name(b,f[i++]),val=kids(b,f[i++]),subject=name(b,f[i++]),spki=f[i++];
    const san=[];let ca=false;
    for(;i<f.length;i++)if(f[i].tag===0xa3)kids(b,node(b,f[i].s)).forEach(x=>{
      const p=kids(b,x),id=oid(b,p[0]),v=p[p.length-1];
      if(id==="2.5.29.17")kids(b,node(b,v.s)).forEach(g=>{
        if(g.tag===0x82)san.push(text(b,g));
        else if(g.tag===0x87){const u=b.subarray(g.s,g.e);san.push(u.length===4?[...u].join("."):u.length===16?ip6(u):"");}});
      else if(id==="2.5.29.19"){const q=kids(b,node(b,v.s));ca=!!(q[0]&&q[0].tag===1&&b[q[0].s]);}
    });
    let s0=serial.s;while(s0<serial.e-1&&b[s0]===0)s0++;
    const sn=san.filter(Boolean),cn=subject["2.5.4.3"]||sn[0]||subject["2.5.4.10"]||"";
    if(!cn)throw new Error("cn");
    return {cn,o:subject["2.5.4.10"]||"",san:sn.length?sn:[cn],emisor:issuer["2.5.4.3"]||issuer["2.5.4.10"]||"",
      desde:time(b,val[0]),hasta:time(b,val[1]),serie:hexs(b,s0,serial.e),clave:key(b,spki),ca};
  }
  async function sha256(der){try{return hexs(new Uint8Array(await crypto.subtle.digest("SHA-256",der)),0,32);}catch(e){return "";}}
  async function read(list){const ok=[];let bad=0;for(const d of list){try{const p=parse(d);p.huella=await sha256(d);ok.push(p);}catch(e){bad++;}}return {ok,bad};}
  function peek(txt){const ok=[];let bad=0;blocks(txt).forEach(d=>{try{ok.push(parse(d));}catch(e){bad++;}});return {ok,bad};}
  return {blocks,parse,read,peek};
})();

async function handleFiles(files){
  const ders=[];let skip=0;
  for(const f of files){
    if(f.size>2e6){skip++;continue;}
    if(/\.json$/i.test(f.name)){importJSON(await f.text(),f.name);return;}
    const b=new Uint8Array(await f.arrayBuffer());
    if(b[0]===0x30)ders.push(b);
    else{const bl=X509.blocks(new TextDecoder().decode(b));if(bl.length)ders.push(...bl);else skip++;}
  }
  if(!ders.length){toast(L("No se ha encontrado ningún certificado en ese archivo","No certificate found in that file"));return;}
  closeModal();const r=await X509.read(ders);r.bad+=skip;applyPem(r);
}

const icsTxt=s=>String(s==null?"":s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
function icsFold(line){   // lineas de 75 bytes como pide el RFC 5545, sin partir caracteres UTF-8
  const enc=new TextEncoder();if(enc.encode(line).length<=75)return line;
  const out=[];let cur="",n=0;
  for(const ch of line){const b=enc.encode(ch).length;if(n+b>75){out.push(cur);cur=" ";n=1;}cur+=ch;n+=b;}
  out.push(cur);return out.join("\r\n");
}

function icsPlan(offs,evs){

    const iso=addD(e.iso,-n);if(iso>=t)out.push({e,n,iso});}));
  return out.sort((x,y)=>x.iso<y.iso?-1:x.iso>y.iso?1:0);
}
